<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dr-Diary">
  <defs>
    <linearGradient id="ddg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- diary cover -->
  <rect x="12" y="6" width="42" height="52" rx="6" fill="url(#ddg)"/>
  <!-- page block -->
  <rect x="18" y="11" width="31" height="42" rx="3" fill="#ffffff" opacity=".95"/>
  <!-- spine + rings -->
  <rect x="8" y="6" width="9" height="52" rx="4.5" fill="#0f766e"/>
  <g fill="#ffffff" opacity=".85">
    <circle cx="12.5" cy="17" r="2.1"/>
    <circle cx="12.5" cy="32" r="2.1"/>
    <circle cx="12.5" cy="47" r="2.1"/>
  </g>
  <!-- pulse line across the page: the diary is a visit log -->
  <path d="M21 34 h6 l3-8 4 15 3.5-9 2.5 4 h6"
        fill="none" stroke="#e11d48" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- medical cross -->
  <path d="M33 15.5v7M29.5 19h7" stroke="#4f46e5" stroke-width="2.6" stroke-linecap="round"/>
  <!-- ruled line under the pulse -->
  <path d="M21 45h25" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity=".55"/>
</svg>
