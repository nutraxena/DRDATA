<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dr-Diary">
  <title>Dr-Diary</title>
  <defs>
    <linearGradient id="dd-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#16c0ae"/>
      <stop offset=".45" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="dd-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <!-- App-icon plate. A filled shape survives being scaled to 16px; an outline
       drawing does not. -->
  <rect width="64" height="64" rx="15" fill="url(#dd-bg)"/>
  <!-- soft top-left sheen -->
  <path d="M0 15A15 15 0 0 1 15 0h34C30 10 14 24 6 42Z" fill="#ffffff" opacity=".13"/>

  <!-- Diary: dark spine on the left, white page block to its right. Only two
       shapes, so the silhouette stays legible when tiny. -->
  <rect x="12" y="12.5" width="8.5" height="39" rx="3.2" fill="#0b5f57"/>
  <rect x="19" y="12.5" width="33" height="39" rx="4.5" fill="url(#dd-page)"/>

  <!-- Heartbeat across the page — the one detail that says "medical visit log".
       Kept thick so it still reads at favicon size. -->
  <path d="M24.5 35.5h4.6l3-9.5 4.6 17 3.4-10 2.3 4.6h4.2"
        fill="none" stroke="#e11d48" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rings, punched through the spine into the page edge. -->
  <g fill="#ffffff" opacity=".9">
    <circle cx="16.2" cy="21" r="1.9"/>
    <circle cx="16.2" cy="32" r="1.9"/>
    <circle cx="16.2" cy="43" r="1.9"/>
  </g>
</svg>
