<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr-Diary</title>
<meta name="description" content="Personal doctor visit diary — day-wise and area-wise doctor planner.">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dr-Diary">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Dr-Diary home">
    <img src="logo.svg" alt="" width="34" height="34">
    <span class="brand-text">Dr<span class="brand-dash">-</span>Diary</span>
  </a>
  <div class="topbar-actions">
    <button id="btn-theme" class="icon-btn" title="Light / dark" aria-label="Toggle theme">◐</button>
  </div>
</header>

<div class="searchwrap">
  <div class="searchrow">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" placeholder="Search doctor, area, hospital, mobile…"
             autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button id="q-clear" class="q-clear" type="button" aria-label="Clear search" hidden>×</button>
    </label>
    <button id="btn-scan" class="round-btn scan" title="Scan a visiting card to add a doctor"
            aria-label="Scan visiting card">📷</button>
    <button id="btn-add" class="round-btn add" title="Add a new doctor"
            aria-label="Add doctor">+</button>
  </div>
</div>

<main id="app" class="app" tabindex="-1"></main>

<nav class="bottomnav" aria-label="Main">
  <a href="#/" data-nav="home"><span class="nav-ico">🏠</span><span>Home</span></a>
  <a href="#/days" data-nav="days"><span class="nav-ico">📅</span><span>Days</span></a>
  <a href="#/areas" data-nav="areas"><span class="nav-ico">📍</span><span>Areas</span></a>
  <a href="#/doctors?type=doctor" data-nav="doctor"><span class="nav-ico">👨‍⚕️</span><span>Doctors</span></a>
  <a href="#/doctors?type=medical" data-nav="medical"><span class="nav-ico">💊</span><span>Medical</span></a>
  <a href="#/doctors?type=distributor" data-nav="distributor"><span class="nav-ico">📦</span><span>Distrib.</span></a>
  <a href="#/data" data-nav="data"><span class="nav-ico">⚙️</span><span>Data</span></a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Visiting card pickers. `capture` opens the rear camera on a phone; the
     plain one lets the OS offer the gallery / files. Both are off-screen and
     driven by the buttons in the UI. -->
<input type="file" id="card-camera-input" accept="image/*" capture="environment" class="sr-only" tabindex="-1">
<input type="file" id="card-gallery-input" accept="image/*" class="sr-only" tabindex="-1">

<div id="lightbox" class="lightbox" hidden>
  <button class="close" data-close-lightbox="1" aria-label="Close">×</button>
  <img id="lightbox-img" alt="Visiting card">
</div>

<!-- Modal host: doctor edit form, slot editor, confirmations. -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">Edit</h2>
      <button class="icon-btn" data-close="1" aria-label="Close">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="js/parse.js"></script>
<script src="js/translit.js"></script>
<script src="js/photos.js"></script>
<script src="js/ocr.js"></script>
<script src="js/store.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/import.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
